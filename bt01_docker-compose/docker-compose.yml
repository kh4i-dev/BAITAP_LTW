name: lab-web

services:
  # Nginx Proxy Manager - điều phối theo Host (web1 / web2)
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    restart: unless-stopped
    environment:
      INITIAL_ADMIN_EMAIL: ${NPM_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${NPM_ADMIN_PASSWORD}
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks: [web_net]

  # Cloudflare Tunnel cho web1.kh4idev.id.vn -> npm:80
  cloudflared-web1:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-web1
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TOKEN_WEB1}
    networks: [web_net]
    depends_on:
      - npm

  # Cloudflare Tunnel cho web2.kh4idev.id.vn -> npm:80
  cloudflared-web2:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-web2
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TOKEN_WEB2}
    networks: [web_net]
    depends_on:
      - npm

  # Node-RED - API backend
  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
    networks: [web_net]

  # MariaDB
  mariadb:
    image: mariadb:10.11
    container_name: mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks: [web_net]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
    ports:
      - "8081:80"
    networks: [web_net]
    depends_on:
      mariadb:
        condition: service_healthy

  # Website 1 (tĩnh)
  web1_app:
    image: nginx:alpine
    container_name: web1_app
    restart: unless-stopped
    volumes:
      - ./web1_html:/usr/share/nginx/html:ro
    networks: [web_net]

  # Website 2 (tĩnh + gọi API Node-RED qua /api)
  web2_app:
    image: nginx:alpine
    container_name: web2_app
    restart: unless-stopped
    volumes:
      - ./web2_html:/usr/share/nginx/html:ro
    networks: [web_net]

  # Portainer - quản lý container bằng GUI
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks: [web_net]

volumes:
  npm_data:
  npm_letsencrypt:
  nodered_data:
  db_data:
  portainer_data:

networks:
  web_net:
    driver: bridge
