<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 1 - kh4idev</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; min-height: 100vh; display: grid; place-items: center;
               background: linear-gradient(135deg, #0f172a, #1e3a8a); color: #e2e8f0; }
        .card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
                backdrop-filter: blur(8px); padding: 48px 56px; border-radius: 18px; text-align: center;
                box-shadow: 0 20px 60px rgba(0,0,0,0.4); max-width: 560px; }
        h1 { font-size: 40px; letter-spacing: 1px; margin-bottom: 12px; }
        .badge { display: inline-block; padding: 6px 16px; border-radius: 999px; font-size: 14px;
                 background: #22c55e22; color: #4ade80; border: 1px solid #22c55e55; margin-bottom: 24px; }
        p { color: #94a3b8; line-height: 1.7; }
        code { background: #0b1220; padding: 2px 8px; border-radius: 6px; color: #93c5fd; }
        .links { margin-top: 28px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        a.btn { text-decoration: none; color: #fff; background: #2563eb; padding: 10px 20px; border-radius: 10px;
                font-size: 15px; transition: .2s; }
        a.btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">● Online</div>
        <h1>Website 1</h1>
        <p>Phục vụ bởi container <code>web1_app</code> (nginx:alpine),<br>
           điều phối qua Nginx Proxy Manager với domain <code>web1.kh4idev.id.vn</code>.</p>
        <div class="links">
            <a class="btn" href="https://web2.kh4idev.id.vn">Sang Website 2 →</a>
        </div>
    </div>
</body>
</html>
